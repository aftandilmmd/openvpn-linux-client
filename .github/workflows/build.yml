name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (openvpn3-linux + test server)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev openvpn easy-rsa
      - name: Install openvpn3 with the app's own installer script
        run: sudo src-tauri/scripts/install-openvpn3-apt.sh jammy
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Import, sign in, connect, disconnect
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --example probe
          sudo PROBE="$PWD/src-tauri/target/debug/examples/probe" scripts/e2e/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: src-tauri/target/debug/examples/probe
          retention-days: 3
      - name: openvpn3 diagnostics
        if: failure()
        run: |
          openvpn3 version || true
          openvpn3 configs-list || true
          busctl --system list | grep -i openvpn || true
          sudo journalctl --no-pager -b | grep -iE "openvpn|dbus-daemon" | tail -80 || true

  install-scripts:
    name: openvpn3 installer (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm
            run: sh /w/install-openvpn3-apt.sh bookworm && dpkg -s openvpn3-client | grep Status && ! dpkg -s dkms >/dev/null 2>&1 && ! command -v g++ && echo no-toolchain-ok
          - image: ubuntu:24.04
            run: sh /w/install-openvpn3-apt.sh noble && dpkg -s openvpn3-client | grep Status && ! dpkg -s dkms >/dev/null 2>&1 && ! command -v g++ && echo no-toolchain-ok
          - image: ubuntu:26.04
            run: sh /w/install-openvpn3-apt.sh resolute && dpkg -s openvpn3-client | grep Status && ! dpkg -s dkms >/dev/null 2>&1 && ! command -v g++ && echo no-toolchain-ok
          - image: fedora:latest
            run: sh /w/install-openvpn3-dnf.sh && rpm -q openvpn3-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bare images without curl or wget also exercise the script's fallback.
      - run: docker run --rm -v "$PWD/src-tauri/scripts:/w:ro" ${{ matrix.image }} sh -c '${{ matrix.run }}'

  e2e-resolute:
    name: End-to-end on Ubuntu 26.04 (fresh install via the app's script)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: probe
          path: probe
      # A container that boots systemd, like a real Ubuntu 26.04 machine.
      - name: Start Ubuntu 26.04 with systemd
        run: |
          chmod +x probe/probe
          printf '%s\n' \
            'FROM ubuntu:26.04' \
            'RUN apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends systemd systemd-sysv dbus ca-certificates openvpn easy-rsa iproute2 libwebkit2gtk-4.1-0 libxdo3' \
            'CMD ["/sbin/init"]' > Dockerfile.resolute
          docker build -q -t resolute-systemd -f Dockerfile.resolute .
          docker run -d --name box --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/src:ro" resolute-systemd
          for i in $(seq 30); do
            docker exec box test -S /run/dbus/system_bus_socket && break; sleep 1
          done
      - name: Install openvpn3 with the app's script
        run: docker exec box sh /src/src-tauri/scripts/install-openvpn3-apt.sh resolute
      - name: Import, sign in, connect, disconnect
        run: docker exec -e PROBE=/src/probe/probe box bash /src/scripts/e2e/run.sh
      - name: openvpn3 logs
        if: failure()
        run: docker exec box journalctl --no-pager -b | grep -iE "openvpn|dbus" | tail -80

  build:
    name: Build ${{ matrix.arch }}
    needs: [e2e, e2e-resolute, install-scripts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 (glibc 2.35) so the packages also run on older distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xdg-utils
          npm ci

      - name: Version from release tag
        if: github.event_name == 'release'
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i "0,/^version = .*/s//version = \"$v\"/" src-tauri/Cargo.toml

      - name: Build and attach to release (signed for in-app updates)
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event.release.id }}

      - name: Build (no update signing)
        if: github.event_name != 'release'
        run: npx tauri build -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-linux-client-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

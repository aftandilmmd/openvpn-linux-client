<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tunnelo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 4 8 13v17c0 15 10 26 24 30 14-4 24-15 24-30V13L32 4Z" fill="currentColor"/>
        <path d="M22 40V30a10 10 0 0 1 20 0v10" fill="none" stroke="var(--on-accent)" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <span>Tunnelo</span>
    </div>
    <div id="summary" class="pill">Disconnected</div>
  </header>

  <div id="update" class="update hidden">
    <span id="update-text"></span>
    <button id="update-btn" class="primary">Update</button>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="profiles" role="tab">Profiles</button>
    <button class="tab" data-tab="log" role="tab">Log</button>
  </nav>

  <main>
    <section id="tab-profiles" class="panel">
      <div id="backend-error" class="notice hidden"></div>
      <ul id="profiles" class="profiles"></ul>
      <div id="empty" class="empty hidden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong>No profiles yet</strong>
        <span>Drop an .ovpn file here or click <b>+</b> to import one.</span>
      </div>
    </section>

    <section id="tab-log" class="panel hidden">
      <div class="log-tools">
        <button id="log-copy" class="ghost">Copy</button>
        <button id="log-clear" class="ghost">Clear</button>
      </div>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <footer class="footer">
    <a id="repo-link" href="#">GitHub</a>
    <span id="backend-version"></span>
  </footer>

  <button id="import" class="fab" title="Import profile" aria-label="Import profile">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <div id="drop" class="drop hidden">Drop .ovpn file to import</div>

  <dialog id="modal">
    <form id="modal-form" method="dialog">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div id="modal-fields"></div>
      <div class="actions">
        <button type="button" id="modal-cancel" class="ghost">Cancel</button>
        <button type="submit" id="modal-ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script src="main.js"></script>
</body>
</html>

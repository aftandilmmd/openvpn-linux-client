[package]
name = "openvpn-linux-client"
version = "0.1.0"
description = "Desktop client for OpenVPN 3 on Linux"
edition = "2021"
repository = "https://github.com/aftandilmmd/openvpn-linux-client"

[lib]
name = "openvpn_linux_client_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
